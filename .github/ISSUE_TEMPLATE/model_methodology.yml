name: Model methodology
description: Propose or question a documented model assumption.
title: "Methodology: "
labels: ["methodology"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Indicator definition or weighting
        - Scenario prior or coefficient
        - Monte Carlo uncertainty
        - Regional pressure model
        - Economic transmission layer
        - Validation or calibration
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and evidence
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Expected validation impact
      description: Identify tests, outputs, or frozen forecasts that could be affected.
    validations:
      required: true
