name: Reproducibility defect
description: Report a pipeline, output, documentation, or installation problem.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Project version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and error output
    validations:
      required: true
